# ── Swaylock Configuration ───────────────────
# Dusk Garden — macOS x Cyberpunk lock screen

daemonize
show-failed-attempts
ignore-empty-password

# Colors (Dusk Garden dark palette)
color=1E1B23

# Inside the ring
inside-color=2A263100
inside-clear-color=99E1D930
inside-ver-color=5D576B30
inside-wrong-color=B4829130

# Ring
ring-color=3D3847
ring-clear-color=99E1D9
ring-ver-color=5D576B
ring-wrong-color=B48291

# Key highlight
key-hl-color=99E1D9
bs-hl-color=B48291

# Separator
separator-color=00000000

# Text
text-color=FCFCFC
text-clear-color=FCFCFC
text-ver-color=FCFCFC
text-wrong-color=FCFCFC

# Layout
indicator-radius=100
indicator-thickness=8

# Font
font=JetBrainsMono Nerd Font
font-size=14
