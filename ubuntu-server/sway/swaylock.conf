# ── Swaylock Configuration ───────────────────
# Dusk Garden — macOS x Cyberpunk lock screen

daemonize
show-failed-attempts
ignore-empty-password
indicator-caps-lock

# ── Background ───────────────────────────────
color=1C1C1E

# ── Inside the ring ──────────────────────────
inside-color=2A263100
inside-clear-color=99E1D920
inside-ver-color=5D576B20
inside-wrong-color=B4829120
inside-caps-lock-color=FFFAE320

# ── Ring ─────────────────────────────────────
ring-color=3D3847
ring-clear-color=99E1D9
ring-ver-color=5D576B
ring-wrong-color=B48291
ring-caps-lock-color=FFFAE3

# ── Key highlight ─────────────────────────────
key-hl-color=99E1D9
bs-hl-color=B48291
caps-lock-key-hl-color=FFFAE3
caps-lock-bs-hl-color=B48291

# ── Lines & separators ───────────────────────
separator-color=00000000
line-uses-inside

# ── Text ─────────────────────────────────────
text-color=FCFCFC
text-clear-color=99E1D9
text-ver-color=8E8E93
text-wrong-color=B48291
text-caps-lock-color=FFFAE3

# ── Layout ───────────────────────────────────
indicator-radius=90
indicator-thickness=10

# ── Font ─────────────────────────────────────
font=JetBrainsMono Nerd Font
font-size=14
