# ── Hyprlock Configuration ───────────────────

general {
    grace = 5
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 6
    noise = 0.02
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
    color = rgba(30, 27, 35, 1.0)
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(61, 56, 71, 1)
    inner_color = rgba(42, 38, 49, 1)
    font_color = rgba(252, 252, 252, 1)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 10
    check_color = rgba(153, 225, 217, 1)
    fail_color = rgba(180, 130, 145, 1)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = rgba(255, 250, 227, 1)

    position = 0, -120
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(252, 252, 252, 1)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(30, 27, 35, 0.5)

    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(180, 130, 145, 1)
    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, 20
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hi, $USER
    color = rgba(255, 250, 227, 1)
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 0, -60
    halign = center
    valign = center
}
