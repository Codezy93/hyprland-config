# ── Monitor Configuration ────────────────────────
# Use `hyprctl monitors all` to list available monitors

# Default: auto-detect, prefer highest refresh rate
monitor = , preferred, auto, 1

# Examples for dual monitor (uncomment and adjust):
# Primary: 144Hz gaming/main display
# monitor = DP-1, 2560x1440@144, 0x0, 1

# Secondary: to the right of primary
# monitor = HDMI-A-1, 1920x1080@60, 2560x0, 1

# Laptop display
# monitor = eDP-1, 1920x1080@144, 0x0, 1

# Mirror mode (uncomment to mirror displays)
# monitor = HDMI-A-1, preferred, auto, 1, mirror, eDP-1
