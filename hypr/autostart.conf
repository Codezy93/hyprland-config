# ── Autostart Applications ───────────────────

# Wallpaper (mpvpaper)
exec-once = mpvpaper -o "loop" '*' ~/.config/hypr/wallpapers/minecraft-northern-light.mp4

# Status bar
exec-once = waybar

# Notification daemon
exec-once = dunst

# Network & Bluetooth
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Authentication agent
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Idle daemon
exec-once = hypridle

# Cursor
exec-once = hyprctl setcursor macOS-Monterey 24

# XDG Desktop Portal
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Desktop Widgets (eww) — only if installed
exec-once = sh -c 'command -v eww && eww daemon && eww open clock-widget'
