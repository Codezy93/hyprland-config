# ── Autostart Applications ───────────────────

# Wallpaper (swww)
exec-once = swww-daemon
exec-once = sleep 1 && bash -c 'for f in ~/.config/hypr/wallpapers/default.{gif,png,jpg,jpeg,webp}; do [ -f "$f" ] && swww img "$f" --transition-type fade --transition-duration 2 && break; done'

# Status bar
exec-once = waybar

# Notification daemon
exec-once = dunst

# Network & Bluetooth
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Authentication agent
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Idle daemon
exec-once = hypridle

# Cursor
exec-once = hyprctl setcursor macOS-Monterey 24

# XDG Desktop Portal
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Desktop Widgets (eww)
exec-once = eww daemon && eww open clock-widget
