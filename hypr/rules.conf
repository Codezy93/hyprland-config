# ── Window Rules — macOS x Cyberpunk ─────────

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Workspace Assignments
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WS 1: Terminal
windowrule = workspace 1, match:class:^(kitty)$

# Add your own app workspace assignments below:
# windowrule = workspace 2, match:class:^(YourEditor)$
# windowrule = workspace 3, match:class:^(YourBrowser)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Float Rules
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# System dialogs
windowrule = float, match:class:^(pavucontrol)$
windowrule = float, match:class:^(nm-connection-editor)$
windowrule = float, match:class:^(blueman-manager)$
windowrule = float, title:^(File Operation Progress)$
windowrule = float, title:^(Picture-in-Picture)$
windowrule = float, title:^(Open File)$
windowrule = float, title:^(Save As)$

# Calculators
windowrule = float, match:class:^(qalculate-gtk)$
windowrule = float, match:class:^(org.gnome.Calculator)$
windowrule = size 420 580, match:class:^(qalculate-gtk)$
windowrule = center, match:class:^(qalculate-gtk)$

# Pin picture-in-picture
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = size 30% 30%, title:^(Picture-in-Picture)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Opacity Rules (frosted glass effect)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrule = opacity 0.92 0.88, match:class:^(kitty)$
windowrule = opacity 0.95 0.90, match:class:^(thunar)$

# Add opacity rules for your apps below:
# windowrule = opacity 0.95 0.90, match:class:^(YourApp)$
# windowrule = opacity 1.0 1.0, match:class:^(YourBrowser)$  # Full opacity for GPU-heavy apps

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Layer Rules (blur behind overlays)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = blur, waybar
layerrule = ignorezero, waybar
