# ── Window Rules — macOS x Cyberpunk ─────────

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Workspace Assignments
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WS 1: Terminal / Neovim
windowrulev2 = workspace 1, class:^(kitty)$

# WS 2: Code Editors
windowrulev2 = workspace 2, class:^(Cursor)$
windowrulev2 = workspace 2, class:^(code-url-handler)$

# WS 3: Browsers
windowrulev2 = workspace 3, class:^(brave-browser)$
windowrulev2 = workspace 3, class:^(google-chrome)$

# WS 4: Communication / Email
windowrulev2 = workspace 4, class:^(thunderbird)$

# WS 5: Databases / API
windowrulev2 = workspace 5, class:^(MongoDB Compass)$
windowrulev2 = workspace 5, class:^(mysql-workbench)$
windowrulev2 = workspace 5, class:^(Postman)$

# WS 6: Docker / Tools
windowrulev2 = workspace 6, class:^(docker-desktop)$

# WS 7: Notes / Knowledge
windowrulev2 = workspace 7, class:^(obsidian)$

# WS 8: Media
windowrulev2 = workspace 8, class:^(Spotify)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Float Rules
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# System dialogs
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, title:^(File Operation Progress)$
windowrulev2 = float, title:^(Picture-in-Picture)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save As)$

# Calculators
windowrulev2 = float, class:^(qalculate-gtk)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = size 420 580, class:^(qalculate-gtk)$
windowrulev2 = center, class:^(qalculate-gtk)$

# Password managers / Auth
windowrulev2 = float, class:^(Bitwarden)$
windowrulev2 = size 900 650, class:^(Bitwarden)$
windowrulev2 = center, class:^(Bitwarden)$
windowrulev2 = float, class:^(ente_auth)$
windowrulev2 = size 400 600, class:^(ente_auth)$
windowrulev2 = center, class:^(ente_auth)$

# LocalSend
windowrulev2 = float, class:^(localsend)$
windowrulev2 = size 500 600, class:^(localsend)$
windowrulev2 = center, class:^(localsend)$

# Docker Desktop
windowrulev2 = float, class:^(docker-desktop)$, title:^(Docker Desktop)$

# Pin picture-in-picture
windowrulev2 = pin, title:^(Picture-in-Picture)$
windowrulev2 = size 30% 30%, title:^(Picture-in-Picture)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Opacity Rules (frosted glass effect)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrulev2 = opacity 0.92 0.88, class:^(kitty)$
windowrulev2 = opacity 0.95 0.90, class:^(Cursor)$
windowrulev2 = opacity 0.95 0.90, class:^(code-url-handler)$
windowrulev2 = opacity 0.95 0.90, class:^(thunar)$
windowrulev2 = opacity 0.95 0.92, class:^(obsidian)$
windowrulev2 = opacity 0.95 0.92, class:^(thunderbird)$
windowrulev2 = opacity 0.95 0.90, class:^(Spotify)$

# Full opacity for GPU-heavy apps
windowrulev2 = opacity 1.0 1.0, class:^(brave-browser)$
windowrulev2 = opacity 1.0 1.0, class:^(google-chrome)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Layer Rules (blur behind overlays)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
layerrule = blur, wofi
layerrule = ignorezero, wofi
layerrule = blur, notifications
layerrule = ignorezero, notifications
layerrule = blur, waybar
layerrule = ignorezero, waybar
