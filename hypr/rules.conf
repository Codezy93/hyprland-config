# ── Window Rules — macOS x Cyberpunk ─────────

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Workspace Assignments
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# WS 1: Terminal
windowrule = workspace 1, match:class ^(kitty)$

# Add your own app workspace assignments below:
# windowrule = workspace 2, match:class ^(YourEditor)$
# windowrule = workspace 3, match:class ^(YourBrowser)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Float Rules
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# System dialogs
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:title ^(File Operation Progress)$
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Save As)$

# Calculators
windowrule = float on, match:class ^(qalculate-gtk)$
windowrule = float on, match:class ^(org.gnome.Calculator)$
windowrule = size 420 580, match:class ^(qalculate-gtk)$
windowrule = center on, match:class ^(qalculate-gtk)$

# Pin picture-in-picture
windowrule = pin on, match:title ^(Picture-in-Picture)$
windowrule = size 30% 30%, match:title ^(Picture-in-Picture)$

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Opacity Rules (frosted glass effect)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
windowrule = opacity 0.92 0.88, match:class ^(kitty)$
windowrule = opacity 0.95 0.90, match:class ^(thunar)$

# Add opacity rules for your apps below:
# windowrule = opacity 0.95 0.90, match:class ^(YourApp)$
# windowrule = opacity 1.0 1.0, match:class ^(YourBrowser)$  # Full opacity for GPU-heavy apps

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Layer Rules (blur behind overlays)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
layerrule = blur on, match:namespace wofi
layerrule = ignore_alpha on, match:namespace wofi
layerrule = blur on, match:namespace notifications
layerrule = ignore_alpha on, match:namespace notifications
layerrule = blur on, match:namespace waybar
layerrule = ignore_alpha on, match:namespace waybar
