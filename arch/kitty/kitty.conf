# ── Tahoe Glass — Kitty Configuration ────────

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Cursor
cursor_shape          beam
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 10000

# Window
window_padding_width  8
background_opacity    0.88
confirm_os_window_close 0
allow_remote_control yes

# Bell
enable_audio_bell no
visual_bell_duration 0

# ── Colors (Tahoe Glass Dark) ───────────────
foreground #F6F7FB
background #141923

# Black
color0  #141923
color8  #5B6472

# Red (rose)
color1  #FF9EB6
color9  #FFB7C9

# Green (mint)
color2  #97E7D6
color10 #B2F0E2

# Yellow (cream)
color3  #F7F4EA
color11 #FFF9ED

# Blue (glass blue)
color4  #8A90B8
color12 #B1B8DC

# Magenta (rose variant)
color5  #C497D8
color13 #DCB6EA

# Cyan (glow)
color6  #8EDBE8
color14 #B7EEF6

# White
color7  #F6F7FB
color15 #FFFFFF

# Selection
selection_foreground #141923
selection_background #8EDBE8

# URL
url_color #8EDBE8
