# ── NVIDIA + CUDA Environment ────────────────────
# Source this file only if you have an NVIDIA GPU.
# The installer enables this automatically if you select NVIDIA.
# Manual: uncomment "source = ~/.config/hypr/nvidia.conf" in hyprland.conf

env = LIBVA_DRIVER_NAME, nvidia
env = XDG_SESSION_TYPE, wayland
env = GBM_BACKEND, nvidia-drm
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = NVD_BACKEND, direct
