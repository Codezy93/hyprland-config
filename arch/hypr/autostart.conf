# ── Autostart Applications ───────────────────

# Wallpaper (mpvpaper)
exec-once = sh -c 'command -v mpvpaper >/dev/null 2>&1 && mpvpaper -o "loop" "*" ~/.config/hypr/wallpapers/minecraft-northern-light.mp4'

# Status bar
exec-once = sh -c 'if command -v waybar >/dev/null 2>&1; then waybar; else notify-send "Waybar" "waybar not found — install it to get the status bar."; fi'

# Notification daemon
exec-once = dunst

# Network & Bluetooth
exec-once = sh -c 'command -v nm-applet >/dev/null 2>&1 && nm-applet --indicator'
exec-once = sh -c 'command -v blueman-applet >/dev/null 2>&1 && blueman-applet'

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Authentication agent
exec-once = sh -c '[ -x /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1 ] && /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1'

# Idle daemon
exec-once = hypridle

# XDG Desktop Portal
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Desktop Dock (eww)
exec-once = sh -c 'command -v eww >/dev/null 2>&1 && eww daemon && eww open app-dock'
