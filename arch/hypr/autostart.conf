# ── Autostart Applications ───────────────────

# Wallpaper (mpvpaper)
exec-once = mpvpaper -o "loop" '*' ~/.config/hypr/wallpapers/minecraft-northern-light.mp4

# Status bar
exec-once = sh -c 'if command -v waybar >/dev/null 2>&1; then waybar; else notify-send "Waybar" "waybar not found — install it to get the status bar."; fi'

# Notification daemon
exec-once = dunst

# Network & Bluetooth
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Clipboard manager
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# Authentication agent
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Idle daemon
exec-once = hypridle

# Cursor
exec-once = hyprctl setcursor macOS-Monterey 24

# XDG Desktop Portal
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

# Desktop Widgets (eww) — requires eww installed AND ~/.config/eww/ configs present
# See: https://elkowar.github.io/eww  |  uncomment once eww configs are set up
# exec-once = sh -c 'command -v eww >/dev/null 2>&1 && eww daemon && eww open clock-widget'
