# ── Hyprlock Configuration ───────────────────

general {
    grace = 5
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 5
    blur_size = 8
    noise = 0.015
    contrast = 1.0
    brightness = 0.72
    vibrancy = 0.28
    color = rgba(13, 18, 26, 0.82)
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.18)
    inner_color = rgba(30, 38, 49, 0.74)
    font_color = rgba(246, 247, 251, 1)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 18
    check_color = rgba(142, 219, 232, 1)
    fail_color = rgba(255, 158, 182, 1)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = rgba(247, 244, 234, 1)

    position = 0, -126
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(246, 247, 251, 1)
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(10, 14, 20, 0.45)

    position = 0, 80
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgba(185, 195, 212, 1)
    font_size = 15
    font_family = JetBrainsMono Nerd Font

    position = 0, 20
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Welcome back, $USER
    color = rgba(247, 244, 234, 1)
    font_size = 14
    font_family = JetBrainsMono Nerd Font

    position = 0, -60
    halign = center
    valign = center
}
