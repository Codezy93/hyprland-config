# ── Appearance — macOS x Cyberpunk ────────────

# ── Decorations ──────────────────────────────────
decoration {
    rounding = 16

    blur {
        enabled = true
        size = 8
        passes = 4
        new_optimizations = true
        xray = false
        ignore_opacity = true
        noise = 0.01
        brightness = 1.0
        contrast = 1.0
    }

    shadow {
        enabled = true
        range = 30
        render_power = 3
        color = rgba(00000055)
        offset = 0 4
    }

    active_opacity = 1.0
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0
}

# ── Animations (macOS-smooth with cyber snap) ────
animations {
    enabled = true

    # macOS-style smooth curves
    bezier = macOS, 0.25, 0.1, 0.25, 1.0
    bezier = macIn, 0.16, 1, 0.3, 1
    bezier = macOut, 0.7, 0, 0.84, 0
    bezier = liner, 1, 1, 1, 1
    bezier = cyber, 0.22, 1.0, 0.36, 1.0

    animation = windows, 1, 5, macOS, slide
    animation = windowsIn, 1, 4, macIn, popin 80%
    animation = windowsOut, 1, 4, macOut, popin 80%
    animation = windowsMove, 1, 4, macOS, slide
    animation = border, 1, 2, liner
    animation = borderangle, 1, 40, liner, loop
    animation = fade, 1, 6, macOS
    animation = workspaces, 1, 4, cyber, slide
    animation = layers, 1, 3, macOS
}

# ── Cursor ───────────────────────────────────────
cursor {
    no_hardware_cursors = 1
}

# ── Environment Variables ────────────────────────
env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, macOS-Monterey
env = QT_QPA_PLATFORMTHEME, qt6ct
env = GTK_THEME, adw-gtk3-dark
