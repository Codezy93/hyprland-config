# ── Appearance — macOS Tahoe Glass ────────────

# ── Decorations ──────────────────────────────────
decoration {
    rounding = 22

    blur {
        enabled = true
        size = 12
        passes = 4
        new_optimizations = true
        xray = false
        ignore_opacity = true
        noise = 0.012
        brightness = 1.05
        contrast = 1.08
    }

    shadow {
        enabled = true
        range = 36
        render_power = 3
        color = rgba(03071266)
        offset = 0 10
    }

    active_opacity = 1.0
    inactive_opacity = 0.94
    fullscreen_opacity = 1.0
}

# ── Animations (macOS Tahoe-style smoothness) ────
animations {
    enabled = true

    bezier = easeOutQuint, 0.22, 1, 0.36, 1
    bezier = easeInOut, 0.42, 0, 0.18, 1
    bezier = linear, 1, 1, 1, 1

    animation = windows, 1, 6, easeOutQuint, slide
    animation = windowsIn, 1, 5, easeOutQuint, popin 88%
    animation = windowsOut, 1, 4, easeInOut, popin 90%
    animation = windowsMove, 1, 5, easeOutQuint, slide
    animation = border, 1, 4, linear
    animation = fade, 1, 6, easeOutQuint
    animation = workspaces, 1, 5, easeOutQuint, slide
    animation = layers, 1, 5, easeOutQuint
}

# ── Cursor ───────────────────────────────────────
cursor {
    no_hardware_cursors = 1
}

# ── Environment Variables ────────────────────────
env = XCURSOR_SIZE, 24
env = QT_QPA_PLATFORMTHEME, qt6ct
env = GTK_THEME, adw-gtk3-dark
