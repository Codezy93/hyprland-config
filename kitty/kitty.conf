# ── Dusk Garden — Kitty Configuration ────────

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

# Cursor
cursor_shape          beam
cursor_blink_interval 0.5

# Scrollback
scrollback_lines 10000

# Window
window_padding_width  8
background_opacity    0.88
confirm_os_window_close 0

# Bell
enable_audio_bell no
visual_bell_duration 0

# ── Colors (Dusk Garden) ────────────────────
foreground #FCFCFC
background #1E1B23

# Black
color0  #1E1B23
color8  #3D3847

# Red (rose)
color1  #B48291
color9  #C99AA8

# Green (mint)
color2  #99E1D9
color10 #B3EBE5

# Yellow (cream)
color3  #FFFAE3
color11 #FFFDF0

# Blue (plum)
color4  #5D576B
color12 #7A7389

# Magenta (rose variant)
color5  #B48291
color13 #C99AA8

# Cyan (mint)
color6  #99E1D9
color14 #B3EBE5

# White
color7  #FCFCFC
color15 #FFFFFF

# Selection
selection_foreground #1E1B23
selection_background #B48291

# URL
url_color #99E1D9
